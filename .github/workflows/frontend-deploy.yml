name: Frontend — Build & Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      [
        "src/**",
        "public/**",
        "index.html",
        "vite.config.*",
        "package.json",
        "package-lock.json",
        ".github/workflows/frontend-deploy.yml",
      ]
  pull_request:
    branches: [main]
    paths:
      [
        "src/**",
        "public/**",
        "index.html",
        "vite.config.*",
        "package.json",
        "package-lock.json",
        ".github/workflows/frontend-deploy.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Static analysis and lint
        run: npm run lint --if-present

      - name: Run test suite
        run: npm test

      - name: Build with Backend URL Injection
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_SYNCSPACE_SERVER_URL: ${{ secrets.VITE_BACKEND_URL }}
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    name: Deploy to Production (main)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Deploy to Cloudflare Pages (production)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx -y wrangler@latest pages deploy dist --project-name="${PAGES_PROJECT:-syncspace-frontend}"

      - name: Skip Cloudflare deployment (missing credentials)
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Skipping production deployment because CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not configured. Build and test checks completed successfully."

  deploy-preview:
    name: Deploy Preview (PR)
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Deploy to Cloudflare Pages (preview)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx -y wrangler@latest pages deploy dist --project-name="${PAGES_PROJECT:-syncspace}" --branch="pr-${{ github.event.pull_request.number }}"

      - name: Skip preview deployment (missing credentials)
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Skipping preview deployment because CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not configured. Build and test checks completed successfully."
